name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    name: API — lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scheduler_owner
          POSTGRES_PASSWORD: owner
          POSTGRES_DB: scheduler
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scheduler_owner -d scheduler"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # E2E tests connect AppModule to Postgres directly and run fixture setup
      # queries (`SELECT FROM dealership ORDER BY created_at`) without setting
      # the per-tx RLS GUC. They MUST use the owner role (BYPASSRLS) — this is
      # what `test/setup.ts:9-12` defaults to locally. Pointing DATABASE_URL at
      # scheduler_app here would silently filter every fixture row to zero,
      # producing "Run seed first" errors despite a successful seed step.
      # Reference: design doc §7.4, ADR-0002.
      DATABASE_URL: postgresql://scheduler_owner:owner@localhost:5432/scheduler
      DATABASE_URL_MIGRATIONS: postgresql://scheduler_owner:owner@localhost:5432/scheduler
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-must-be-32-chars-or-more-aaaa
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-32-chars-or-more-bbbb
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: test
      LOG_LEVEL: warn
      # Tracing off — keeps stdout clean and avoids OTLP connection retries.
      OTLP_ENDPOINT: ""
      OTEL_CONSOLE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Initialize Postgres extensions and roles
        run: |
          PGPASSWORD=owner psql -h localhost -U scheduler_owner -d scheduler -f packages/api/db/init/01-extensions.sql
          PGPASSWORD=owner psql -h localhost -U scheduler_owner -d scheduler -f packages/api/db/init/02-roles.sql
      - run: pnpm --filter @keyloop/api lint
      - run: pnpm --filter @keyloop/api typecheck
      - run: pnpm --filter @keyloop/api test:unit
      # Integration tests bring up their own schema via raw migration replay
      # (see exclude-race.int-spec.ts), so no external migrate step is needed
      # before this — but it's harmless either way.
      - run: pnpm --filter @keyloop/api test:int
      # E2E suites hit the same Postgres as the AppModule. They expect both the
      # full schema (migrations) and base seed data (dealership + technicians +
      # service types + bays). Without these, every spec fails with
      # "relation \"appointment_history\" does not exist" or similar.
      - name: Migrate + seed for e2e
        run: |
          pnpm --filter @keyloop/api migration:run
          pnpm --filter @keyloop/api seed:dev
      - run: pnpm --filter @keyloop/api test:e2e
      - run: pnpm --filter @keyloop/api build

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keyloop/web lint
      - run: pnpm --filter @keyloop/web typecheck
      - run: pnpm --filter @keyloop/web build
