services:
  # ===== Core (always up) =====
  postgres:
    image: postgres:16-alpine
    container_name: keyloop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-owner}
      POSTGRES_DB: scheduler
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_owner -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: keyloop-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ===== Observability stack =====
  # All four services live under the `observability` profile. They start when
  # `pnpm setup` runs `docker compose --profile observability up -d`.
  # Without the profile flag, only postgres + redis come up.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: keyloop-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./packages/api/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
      - "4317:4317" # OTLP gRPC
    profiles: ["observability"]

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: keyloop-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # Collector OTLP gRPC (collector → jaeger)
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: keyloop-prometheus
    volumes:
      - ./packages/api/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.0.0
    container_name: keyloop-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./loadtest/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./loadtest/grafana-dashboard.json:/var/lib/grafana/dashboards/keyloop-slo.json:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

volumes:
  postgres-data:
