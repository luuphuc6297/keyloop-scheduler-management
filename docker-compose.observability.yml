services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: keyloop-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./packages/api/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
    profiles: ["observability"]

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: keyloop-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: keyloop-prometheus
    volumes:
      - ./packages/api/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.0.0
    container_name: keyloop-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./loadtest/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./loadtest/grafana-dashboard.json:/var/lib/grafana/dashboards/keyloop-slo.json:ro
    ports:
      - "3030:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]
